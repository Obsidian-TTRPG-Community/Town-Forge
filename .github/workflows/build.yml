name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type-check (advisory — reconstructed source is untyped)
        run: npm run typecheck
        continue-on-error: true

      - name: Build plugin
        run: npm run build

      - name: Verify build output exists
        run: test -f main.js && echo "main.js built successfully"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: town-forge-build
          path: |
            main.js
            manifest.json
            versions.json
